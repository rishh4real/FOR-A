<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Apurvaa 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Hind:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --rose: #ff5f93;
    --blush: #ffb3c6;
    --gold: #ffd166;
    --teal: #5ee0c2;
    --plum: #180718;
    --ink: #050409;
  }

  body {
    background:
      linear-gradient(180deg, #050409 0%, #120613 28%, #1d0818 48%, #071915 76%, #050409 100%);
    font-family: 'Hind', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
    position: relative;
    color: #fff;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(118deg, transparent 0 10%, rgba(255, 209, 102, 0.18) 11%, rgba(255, 95, 147, 0.1) 16%, transparent 24%),
      linear-gradient(62deg, transparent 0 52%, rgba(94, 224, 194, 0.15) 56%, rgba(255, 179, 198, 0.12) 62%, transparent 70%),
      repeating-linear-gradient(128deg, transparent 0 34px, rgba(255,255,255,0.028) 35px, transparent 38px 96px);
    animation: backgroundFloat 16s ease-in-out infinite;
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(circle at 18% 22%, rgba(255, 209, 102, 0.9) 0 1px, transparent 2px),
      radial-gradient(circle at 72% 18%, rgba(255, 179, 198, 0.8) 0 1px, transparent 2px),
      radial-gradient(circle at 82% 68%, rgba(94, 224, 194, 0.75) 0 1px, transparent 2px),
      radial-gradient(circle at 36% 76%, rgba(255, 255, 255, 0.65) 0 1px, transparent 2px),
      linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
    background-size: 130px 130px, 170px 170px, 150px 150px, 210px 210px, 72px 72px;
    opacity: 0.35;
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent 92%);
    pointer-events: none;
    z-index: 0;
  }

  @keyframes backgroundFloat {
    0%, 100% { transform: translate3d(0, 0, 0) skewY(-2deg); }
    50% { transform: translate3d(-24px, 18px, 0) skewY(2deg); }
  }

  /* Starfield */
  .stars {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }

  .star {
    position: absolute;
    background: #ffe7a8;
    border-radius: 50%;
    box-shadow: 0 0 10px rgba(255, 209, 102, 0.65);
    animation: twinkle var(--d) ease-in-out infinite alternate;
  }

  @keyframes twinkle {
    from { opacity: 0.1; transform: scale(1); }
    to { opacity: 0.9; transform: scale(1.4); }
  }

  /* Floating petals */
  .petal {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    animation: petalFall linear infinite;
    font-size: var(--sz);
    opacity: 0.7;
    filter: drop-shadow(0 0 8px rgba(255, 95, 147, 0.4));
  }

  @keyframes petalFall {
    0% { transform: translateY(-60px) rotate(0deg) translateX(0); opacity: 0; }
    10% { opacity: 0.7; }
    90% { opacity: 0.5; }
    100% { transform: translateY(110vh) rotate(720deg) translateX(var(--drift)); opacity: 0; }
  }

  /* Floating flowers */
  .floating-flower {
    position: fixed;
    pointer-events: none;
    z-index: 1;
    font-size: 3rem;
    opacity: 0.4;
    filter: drop-shadow(0 0 15px rgba(255, 95, 147, 0.6));
    animation: floatFlower 12s ease-in-out infinite;
  }

  @keyframes floatFlower {
    0% { transform: translateY(0) translateX(0) scale(0.8); opacity: 0; }
    15% { opacity: 0.5; }
    85% { opacity: 0.3; }
    100% { transform: translateY(-100px) translateX(50px) scale(1.1); opacity: 0; }
  }

  /* Bloom flowers */
  .bloom {
    position: fixed;
    pointer-events: none;
    z-index: 0;
    font-size: 4rem;
    opacity: 0;
    animation: bloom 4s ease-in-out infinite;
    filter: drop-shadow(0 0 20px rgba(255, 209, 102, 0.5));
  }

  @keyframes bloom {
    0% { opacity: 0; transform: scale(0.2); }
    30% { opacity: 0.6; transform: scale(1); }
    70% { opacity: 0.4; transform: scale(1.1); }
    100% { opacity: 0; transform: scale(1.3); }
  }

  /* Living flower garden inspired by blooming night-flower CSS */
  .live-garden {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 3;
    overflow: hidden;
    opacity: 0.78;
    perspective: 900px;
  }

  .css-flower {
    --x: 50%;
    --stem: 36vmin;
    --size: 7vmin;
    --tilt: 0deg;
    --delay: 0s;
    --speed: 4s;
    --petal-a: #ff7aa8;
    --petal-b: #ffc0d3;
    --leaf: #39c6d6;
    position: absolute;
    bottom: -7vmin;
    left: var(--x);
    width: 12vmin;
    height: calc(var(--stem) + 14vmin);
    transform-origin: bottom center;
    transform: translateX(-50%) rotate(var(--tilt));
    opacity: 0.48;
    filter: drop-shadow(0 0 2.2vmin rgba(255, 95, 147, 0.34));
    animation: cssFlowerSway var(--speed) ease-in-out infinite;
    animation-delay: calc(var(--delay) + 2.8s);
  }

  .flower-stem {
    content: '';
    position: absolute;
    left: 50%;
    bottom: 0;
    width: 0.45vmin;
    height: var(--stem);
    background:
      linear-gradient(to left, rgba(0,0,0,0.24), transparent, rgba(255,255,255,0.22)),
      linear-gradient(to top, transparent 5%, rgba(20,117,122,0.62), var(--leaf));
    border-radius: 999px;
    box-shadow: inset 0 0 0.5vmin rgba(255,255,255,0.18), 0 0 2vmin rgba(57,198,214,0.22);
    transform: translateX(-50%) scaleY(0);
    transform-origin: bottom;
    animation: cssStemGrow 3.4s ease var(--delay) forwards;
  }

  .stem-leaf {
    position: absolute;
    width: 6.5vmin;
    height: 8vmin;
    border-top-right-radius: 8vmin;
    border-bottom-left-radius: 8vmin;
    background: linear-gradient(to top, rgba(20,117,122,0.22), var(--leaf));
    opacity: 0;
    box-shadow: inset 0 0 1.3vmin rgba(255,255,255,0.18);
    transform-origin: bottom left;
    animation: cssLeafOpen 0.9s ease forwards;
  }

  .stem-leaf.left {
    left: calc(50% - 7vmin);
    bottom: calc(var(--stem) * 0.45);
    transform: rotate(-68deg) rotateY(24deg) scale(0);
    animation-delay: calc(var(--delay) + 1.2s);
  }

  .stem-leaf.right {
    left: calc(50% + 0.9vmin);
    bottom: calc(var(--stem) * 0.24);
    transform: rotate(68deg) rotateY(-24deg) scale(0);
    animation-delay: calc(var(--delay) + 1.55s);
  }

  .stem-leaf.small {
    width: 4.8vmin;
    height: 6vmin;
    bottom: calc(var(--stem) * 0.67);
    animation-delay: calc(var(--delay) + 1.85s);
  }

  .flower-bloom {
    position: absolute;
    left: 50%;
    bottom: var(--stem);
    width: var(--size);
    height: var(--size);
    transform: translate(-50%, 45%) scale(0) rotateX(16deg);
    transform-style: preserve-3d;
    animation: cssBloomOpen 1.8s cubic-bezier(.2,.85,.2,1.25) calc(var(--delay) + 2.1s) forwards,
               cssBloomPulse 3.6s ease-in-out calc(var(--delay) + 3.4s) infinite;
  }

  .flower-bloom::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 10vmin;
    height: 10vmin;
    background: radial-gradient(circle, rgba(255,209,102,0.54), transparent 68%);
    transform: translate(-50%, -50%);
    filter: blur(1.8vmin);
  }

  .petal {
    position: absolute;
    left: 50%;
    bottom: 50%;
    width: calc(var(--size) * 0.56);
    height: calc(var(--size) * 0.86);
    border-radius: 56% 44% 48% 52% / 34% 36% 64% 66%;
    background: radial-gradient(circle at 38% 26%, #fff8fb 0 12%, var(--petal-b) 34%, var(--petal-a) 86%);
    transform-origin: bottom center;
    opacity: 0.92;
    box-shadow: inset 0 0 1.2vmin rgba(255,255,255,0.35);
  }

  .bloom-petal:nth-child(1) { transform: translateX(-50%) rotate(0deg) translateY(-46%); }
  .bloom-petal:nth-child(2) { transform: translateX(-50%) rotate(60deg) translateY(-46%); }
  .bloom-petal:nth-child(3) { transform: translateX(-50%) rotate(120deg) translateY(-46%); }
  .bloom-petal:nth-child(4) { transform: translateX(-50%) rotate(180deg) translateY(-46%); }
  .bloom-petal:nth-child(5) { transform: translateX(-50%) rotate(240deg) translateY(-46%); }
  .bloom-petal:nth-child(6) { transform: translateX(-50%) rotate(300deg) translateY(-46%); }

  .bloom-core {
    position: absolute;
    left: 50%;
    top: 50%;
    width: calc(var(--size) * 0.34);
    height: calc(var(--size) * 0.34);
    background: radial-gradient(circle at 40% 35%, #fff9ce, #ffd166 62%, #ff8fab);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 2vmin rgba(255, 209, 102, 0.74);
  }

  .garden-grass {
    position: absolute;
    bottom: -1vmin;
    left: 0;
    width: 100%;
    height: 22vmin;
    opacity: 0.32;
    filter: drop-shadow(0 0 2vmin rgba(94,224,194,0.18));
  }

  .grass-blade {
    position: absolute;
    left: var(--x);
    bottom: 0;
    width: var(--w);
    height: var(--h);
    border-top-left-radius: 100%;
    border-left: 0.45vmin solid rgba(57, 198, 214, 0.62);
    transform-origin: bottom center;
    transform: rotate(var(--r));
    -webkit-mask-image: linear-gradient(to top, transparent 6%, #000 58%);
    mask-image: linear-gradient(to top, transparent 6%, #000 58%);
    animation: grassSway var(--speed) ease-in-out infinite;
    animation-delay: var(--delay);
  }

  .firefly {
    position: absolute;
    left: var(--x);
    bottom: var(--y);
    width: 0.9vmin;
    height: 0.9vmin;
    border-radius: 50%;
    background: #fff59a;
    box-shadow: 0 0 1.6vmin #ffd166, 0 0 3.2vmin rgba(94,224,194,0.58);
    opacity: 0;
    animation: fireflyRise var(--speed) linear infinite;
    animation-delay: var(--delay);
  }

  @keyframes cssStemGrow {
    to { transform: translateX(-50%) scaleY(1); }
  }

  @keyframes cssLeafOpen {
    to { opacity: 0.86; transform: rotate(var(--open-rotate, -68deg)) rotateY(24deg) scale(1); }
  }

  .stem-leaf.right {
    --open-rotate: 68deg;
  }

  @keyframes cssBloomOpen {
    to { transform: translate(-50%, 45%) scale(1) rotateX(16deg); }
  }

  @keyframes cssBloomPulse {
    0%, 100% { filter: brightness(1) saturate(1); }
    50% { filter: brightness(1.18) saturate(1.15); }
  }

  @keyframes cssFlowerSway {
    0%, 100% { transform: translateX(-50%) rotate(calc(var(--tilt) - 1.8deg)) rotateY(-4deg); }
    50% { transform: translateX(-50%) rotate(calc(var(--tilt) + 2deg)) rotateY(5deg) translateY(-0.8vmin); }
  }

  @keyframes grassSway {
    0%, 100% { transform: rotate(var(--r)); }
    50% { transform: rotate(calc(var(--r) + 5deg)); }
  }

  @keyframes fireflyRise {
    0% { opacity: 0; transform: translate3d(0, 0, 0) scale(0.7); }
    12% { opacity: 0.85; }
    55% { opacity: 0.9; transform: translate3d(var(--drift), -18vmin, 0) scale(1); }
    100% { opacity: 0; transform: translate3d(calc(var(--drift) * -0.4), -36vmin, 0) scale(0.4); }
  }

  /* Layout */
  .page {
    position: relative;
    z-index: 2;
    min-height: 100svh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 20px;
    transition: all 0.6s ease;
    isolation: isolate;
    overflow: hidden;
  }

  .page::before {
    content: '';
    position: absolute;
    inset: 0;
    background:
      linear-gradient(112deg, rgba(255, 209, 102, 0.19) 0 8%, transparent 17% 58%, rgba(255, 95, 147, 0.15) 66%, transparent 76%),
      linear-gradient(24deg, transparent 0 34%, rgba(94, 224, 194, 0.11) 45%, transparent 58%),
      linear-gradient(180deg, rgba(255,255,255,0.06), transparent 42%, rgba(0,0,0,0.28));
    pointer-events: none;
    z-index: -1;
  }

  .page:hover::before {
    filter: saturate(1.2) brightness(1.08);
  }

  .page::after {
    content: '';
    position: absolute;
    inset: 0;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 1px, transparent 1px 86px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.025) 0 1px, transparent 1px 86px);
    opacity: 0.22;
    mask-image: radial-gradient(ellipse at center, black 0%, transparent 78%);
    pointer-events: none;
    z-index: -1;
  }

  /* === PAGE 1 === */
  .page-1 {
    background:
      linear-gradient(135deg, rgba(255, 95, 147, 0.18) 0 16%, transparent 36%),
      linear-gradient(315deg, rgba(255, 209, 102, 0.15) 0 12%, transparent 32%),
      radial-gradient(ellipse at 76% 46%, rgba(94, 224, 194, 0.14), transparent 42%),
      linear-gradient(145deg, #060408 0%, #1d061a 45%, #0b0510 100%);
  }

  .p1-inner {
    max-width: 900px;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    align-items: center;
    position: relative;
    z-index: 4;
  }

  /* Big photo left */
  .photo-main {
    position: relative;
  }

  .photo-main::before,
  .photo-right::before {
    content: '';
    position: absolute;
    inset: -32px;
    background:
      linear-gradient(135deg, rgba(255, 209, 102, 0.32), transparent 34%, rgba(94, 224, 194, 0.2)),
      linear-gradient(48deg, transparent 0 34%, rgba(255, 95, 147, 0.35) 44%, transparent 58%);
    border-radius: 48% 52% 44% 56% / 52% 45% 55% 48%;
    filter: blur(20px);
    opacity: 0.9;
    pointer-events: none;
    z-index: -1;
    animation: photoAura 7s ease-in-out infinite;
  }

  @keyframes photoAura {
    0%, 100% { transform: rotate(-2deg) scale(0.98); opacity: 0.78; }
    50% { transform: rotate(3deg) scale(1.04); opacity: 1; }
  }

  .photo-main img {
    width: 100%;
    max-width: 420px;
    border-radius: 60% 40% 55% 45% / 50% 55% 45% 50%;
    border: 3px solid rgba(255, 209, 102, 0.42);
    box-shadow:
      0 24px 80px rgba(0,0,0,0.55),
      0 0 55px rgba(255,95,147,0.32),
      0 0 110px rgba(255,209,102,0.16);
    display: block;
    object-fit: cover;
    aspect-ratio: 3/4;
    filter: brightness(1.05) saturate(1.1);
    animation: morphShape 8s ease-in-out infinite;
  }

  @keyframes morphShape {
    0%, 100% { border-radius: 60% 40% 55% 45% / 50% 55% 45% 50%; }
    33% { border-radius: 45% 55% 40% 60% / 55% 45% 55% 45%; }
    66% { border-radius: 55% 45% 60% 40% / 45% 55% 45% 55%; }
  }

  .flower-ring {
    position: absolute;
    top: -20px; left: -20px; right: -20px; bottom: -20px;
    border-radius: 50%;
    pointer-events: none;
    animation: rotateSlow 20s linear infinite;
  }

  @keyframes rotateSlow {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .flower-ring span {
    position: absolute;
    font-size: 22px;
  }

  /* Text right */
  .text-right {
    padding-left: 50px;
  }

  .goriye-text {
    font-family: 'Playfair Display', serif;
    font-style: italic;
    color: #ffd166;
    font-size: 13px;
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s forwards;
  }

  .main-quote {
    font-family: 'Playfair Display', serif;
    font-size: clamp(22px, 3.5vw, 36px);
    line-height: 1.55;
    color: #fff;
    text-shadow: 0 2px 18px rgba(0,0,0,0.48);
    margin-bottom: 30px;
    opacity: 0;
    animation: fadeUp 1s ease 0.6s forwards;
  }

  .main-quote .highlight {
    color: #ff8fab;
    text-shadow: 0 0 30px rgba(255,100,150,0.5);
  }

  .flutter-line {
    display: inline-block;
    animation: flutter 3s ease-in-out infinite;
    transform-origin: left center;
  }

  @keyframes flutter {
    0%, 100% { transform: rotate(-1deg) translateY(0); }
    25% { transform: rotate(1.5deg) translateY(-3px); }
    50% { transform: rotate(-0.5deg) translateY(2px); }
    75% { transform: rotate(2deg) translateY(-2px); }
  }

  .small-photos-row {
    display: flex;
    gap: 12px;
    opacity: 0;
    animation: fadeUp 1s ease 1s forwards;
  }

  .small-photo {
    width: 90px;
    height: 110px;
    object-fit: cover;
    border-radius: 50px 50px 40px 40px;
    border: 2px solid rgba(255, 209, 102, 0.42);
    filter: brightness(1.05) saturate(1.1);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
  }

  .small-photo:hover {
    transform: scale(1.08) translateY(-5px);
    box-shadow: 0 10px 30px rgba(255,95,147,0.42);
  }

  /* === PAGE 2 === */
  .page-2 {
    background:
      linear-gradient(40deg, rgba(94, 224, 194, 0.17) 0 16%, transparent 35%),
      linear-gradient(140deg, transparent 0 48%, rgba(255, 209, 102, 0.15) 60%, transparent 76%),
      radial-gradient(ellipse at 26% 48%, rgba(255, 95, 147, 0.18), transparent 46%),
      linear-gradient(145deg, #04110f 0%, #130712 48%, #210915 100%);
    flex-direction: column;
  }

  .p2-inner {
    max-width: 900px;
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    align-items: center;
    position: relative;
    z-index: 4;
  }

  .text-left {
    padding-right: 50px;
  }

  .label-small {
    font-size: 11px;
    letter-spacing: 4px;
    color: #5ee0c2;
    text-transform: uppercase;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 1s ease 0.2s forwards;
  }

  .love-note {
    font-family: 'Playfair Display', serif;
    font-size: clamp(20px, 3vw, 32px);
    line-height: 1.6;
    color: #e8f4e8;
    text-shadow: 0 2px 18px rgba(0,0,0,0.5);
    margin-bottom: 32px;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s forwards;
  }

  .love-note .punjabi-word {
    color: #7ddba0;
    font-style: italic;
    display: inline-block;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-5px); }
  }

  .love-note .banger-word {
    color: #ff8fab;
    font-weight: 700;
    display: inline-block;
    animation: wiggle 2.5s ease-in-out infinite;
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(-2deg); }
    50% { transform: rotate(2deg); }
  }

  /* Big photo right side */
  .photo-right {
    position: relative;
    display: flex;
    justify-content: center;
  }

  .photo-right img {
    width: 100%;
    max-width: 380px;
    border-radius: 45% 55% 50% 50% / 40% 45% 55% 60%;
    border: 3px solid rgba(94, 224, 194, 0.42);
    box-shadow:
      0 24px 80px rgba(0,0,0,0.55),
      0 0 55px rgba(94,224,194,0.28),
      0 0 110px rgba(255,95,147,0.14);
    display: block;
    object-fit: cover;
    aspect-ratio: 3/4;
    filter: brightness(1.05) saturate(1.1);
    animation: morphShape2 9s ease-in-out infinite;
  }

  @keyframes morphShape2 {
    0%, 100% { border-radius: 45% 55% 50% 50% / 40% 45% 55% 60%; }
    33% { border-radius: 55% 45% 45% 55% / 55% 60% 40% 45%; }
    66% { border-radius: 40% 60% 55% 45% / 50% 45% 55% 50%; }
  }

  /* Name stamp */
  .name-stamp {
    font-family: 'Playfair Display', serif;
    font-size: 90px;
    font-weight: 700;
    position: fixed;
    bottom: -20px;
    right: -10px;
    color: rgba(255, 209, 102, 0.055);
    letter-spacing: -4px;
    pointer-events: none;
    z-index: 1;
    white-space: nowrap;
  }

  /* Divider between pages */
  .page-divider {
    position: relative;
    z-index: 2;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(255,209,102,0.72), rgba(255,95,147,0.56), rgba(94,224,194,0.62), transparent);
    box-shadow: 0 0 32px rgba(255, 95, 147, 0.35);
  }

  /* Floating flowers decoration */
  .float-deco {
    position: absolute;
    font-size: 28px;
    animation: floatDeco 6s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes floatDeco {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-15px) rotate(10deg); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(25px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* Responsive */
  @media (max-width: 700px) {
    body::before {
      animation: none;
      opacity: 0.65;
    }

    body::after {
      opacity: 0.22;
    }

    .page {
      min-height: 100svh;
      padding: 84px 18px 72px;
    }

    .p1-inner, .p2-inner {
      grid-template-columns: 1fr;
      text-align: center;
      gap: 24px;
    }
    .text-right { padding-left: 0; padding-top: 30px; }
    .text-left { padding-right: 0; padding-bottom: 30px; }
    .small-photos-row { justify-content: center; }
    .photo-right { order: -1; }
    .photo-main::before,
    .photo-right::before {
      inset: -18px;
      filter: blur(12px);
      opacity: 0.58;
      animation: none;
    }
    .photo-main img,
    .photo-right img {
      max-width: min(76vw, 285px);
      margin: 0 auto;
      box-shadow: 0 18px 48px rgba(0,0,0,0.48), 0 0 32px rgba(255,95,147,0.2);
      animation-duration: 14s;
    }
    .main-quote,
    .love-note {
      font-size: clamp(24px, 8vw, 34px);
      line-height: 1.38;
      margin-bottom: 22px;
    }
    .small-photo {
      width: 74px;
      height: 88px;
    }
    .flower-ring,
    .float-deco,
    .floating-flower,
    .bloom {
      display: none;
    }
    .live-garden {
      opacity: 0.42;
      z-index: 1;
    }
    .css-flower {
      opacity: 0.26;
      filter: none;
    }
    .garden-grass {
      opacity: 0.2;
    }
    .firefly {
      box-shadow: 0 0 1.2vmin #ffd166;
    }
  }

  /* Heart pulse */
  .heart {
    display: inline-block;
    animation: heartbeat 1.2s ease-in-out infinite;
    color: #ff6b8a;
  }

  @keyframes heartbeat {
    0%, 100% { transform: scale(1); }
    14% { transform: scale(1.3); }
    28% { transform: scale(1); }
    42% { transform: scale(1.2); }
    70% { transform: scale(1); }
  }

  .music-toggle {
    position: fixed;
    right: 22px;
    top: 22px;
    z-index: 10;
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 44px;
    padding: 10px 16px;
    border: 1px solid rgba(255, 209, 102, 0.45);
    border-radius: 999px;
    background: rgba(10, 5, 12, 0.72);
    color: #fff7dc;
    font: 600 13px/1 'Hind', sans-serif;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 14px 38px rgba(0,0,0,0.35), 0 0 28px rgba(255, 95, 147, 0.24);
    backdrop-filter: blur(14px);
    cursor: pointer;
    transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
  }

  .music-toggle:hover {
    transform: translateY(-2px);
    border-color: rgba(255, 179, 198, 0.85);
    box-shadow: 0 18px 44px rgba(0,0,0,0.42), 0 0 34px rgba(255, 95, 147, 0.38);
  }

  .music-toggle .music-icon {
    width: 24px;
    height: 24px;
    display: grid;
    place-items: center;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff5f93, #ffd166);
    box-shadow: 0 0 18px rgba(255, 95, 147, 0.58);
  }

  .music-toggle.is-playing .music-icon {
    animation: musicPulse 1.2s ease-in-out infinite;
  }

  .song-video {
    position: fixed;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  @keyframes musicPulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.14); }
  }

  @media (max-width: 700px) {
    .music-toggle {
      top: 14px;
      right: 14px;
      padding: 9px 12px;
      font-size: 11px;
    }
  }
</style>
</head>
<body>

<audio class="song-video" id="songPlayer" src="song.m4a" preload="auto" loop></audio>
<button class="music-toggle" id="musicToggle" type="button" aria-label="Play song">
  <span class="music-icon">♪</span>
  <span class="music-label">Play song</span>
</button>

<!-- Stars -->
<div class="stars" id="stars"></div>

<!-- Floating petals -->
<div id="petals"></div>

<!-- Floating flowers -->
<div id="floating-flowers"></div>

<!-- Bloom effects -->
<div id="blooms"></div>

<!-- Living garden -->
<div class="live-garden" id="liveGarden"></div>

<!-- Watermark -->
<div class="name-stamp">Apurvaa</div>

<!-- ===== PAGE 1 ===== -->
<section class="page page-1">
  <div class="p1-inner">

    <!-- Left: big main photo -->
    <div class="photo-main">
      <div class="flower-ring" id="flowerRing"></div>
      <img src="apurvaa_1.jpg" alt="Apurvaa" />
    </div>

    <!-- Right: text + small photos -->
    <div class="text-right">
      <p class="goriye-text">✦ Apurvaa ✦</p>

      <div class="main-quote">
        <span class="flutter-line">"Tu ta bss</span><br>
        <span class="flutter-line" style="animation-delay:0.3s; color:#ff8fab;">haa ee n kehndi</span><br>
        <span class="flutter-line" style="animation-delay:0.6s;">goriye,</span><br><br>
        <span class="flutter-line" style="animation-delay:0.9s; color:#ffb3c6;">tere utte album</span><br>
        <span class="flutter-line" style="animation-delay:1.2s;">hune krja."</span>
        <span class="heart"> ♥</span>
      </div>

      <div class="small-photos-row">
        <img class="small-photo" src="apurvaa_main.jpg" alt="Apurvaa" />
        <img class="small-photo" src="apurvaa_2.jpg" alt="Apurvaa" />
        <img class="small-photo" src="apurvaa_4.jpg" alt="Apurvaa" />
      </div>
    </div>

  </div>

  <!-- Corner decos -->
  <div class="float-deco" style="top:40px; right:60px; animation-delay:0s;">🌸</div>
  <div class="float-deco" style="top:80px; left:40px; animation-delay:1s; font-size:20px;">🌷</div>
  <div class="float-deco" style="bottom:60px; right:80px; animation-delay:2s; font-size:18px;">✿</div>
</section>

<!-- Divider -->
<div class="page-divider"></div>

<!-- ===== PAGE 2 ===== -->
<section class="page page-2">
  <div class="p2-inner">

    <!-- Left: love note -->
    <div class="text-left">
      <p class="label-small">✦ rishh's note ✦</p>

      <div class="love-note">
        "<span class="punjabi-word">Tu thodi thodi</span><br>
        thiki lgge <span class="banger-word">dayum</span> gurl,<br><br>
        <span style="color:#ffb3c6; display:inline-block; animation: flutter 3s ease-in-out 0.5s infinite;">Rishh wanna be</span><br>
        <span style="color:#ff8fab; font-style:italic;">ur man gurl,</span><br><br>
        teri body bhi<br>
        mere gaano ki trh<br>
        <span class="banger-word" style="font-size: 1.2em; color:#7ddba0;">BANGER."</span>
        <span class="heart"> ♥</span>
      </div>
    </div>

    <!-- Right: photo -->
    <div class="photo-right">
      <div class="flower-ring" id="flowerRing2" style="animation-direction: reverse;"></div>
      <img src="apurvaa_3.jpg" alt="Apurvaa" />
    </div>

  </div>

  <div class="float-deco" style="bottom:40px; left:60px; animation-delay:0.5s;">🌺</div>
  <div class="float-deco" style="top:50px; right:50px; animation-delay:1.5s; font-size:20px;">🌸</div>
  <div class="float-deco" style="bottom:80px; right:100px; animation-delay:2.5s; font-size:16px;">💐</div>
</section>

<script>
const isMobile = window.matchMedia('(max-width: 700px), (pointer: coarse)').matches;
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const motionLite = isMobile || prefersReducedMotion;

// Stars
const starsEl = document.getElementById('stars');
const starCount = motionLite ? 42 : 120;
for (let i = 0; i < starCount; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  const size = Math.random() * 2.5 + 0.5;
  s.style.cssText = `
    width: ${size}px; height: ${size}px;
    top: ${Math.random() * 100}%;
    left: ${Math.random() * 100}%;
    --d: ${Math.random() * 4 + 2}s;
    animation-delay: ${Math.random() * 5}s;
  `;
  starsEl.appendChild(s);
}

// Floating petals
const petalsEl = document.getElementById('petals');
const petalEmojis = ['🌸', '🌺', '✿', '🌷', '🌼', '💮'];
function spawnPetal() {
  const p = document.createElement('div');
  p.className = 'petal';
  p.textContent = petalEmojis[Math.floor(Math.random() * petalEmojis.length)];
  const size = Math.random() * 14 + 12;
  const drift = (Math.random() - 0.5) * 200;
  p.style.cssText = `
    left: ${Math.random() * 100}%;
    --sz: ${size}px;
    --drift: ${drift}px;
    animation-duration: ${Math.random() * 8 + 8}s;
    animation-delay: ${Math.random() * 5}s;
  `;
  petalsEl.appendChild(p);
  setTimeout(() => p.remove(), 16000);
}
setInterval(spawnPetal, motionLite ? 1400 : 600);
for (let i = 0; i < (motionLite ? 4 : 12); i++) spawnPetal();

// Floating flowers
const floatingFlowersEl = document.getElementById('floating-flowers');
const flowerEmojis = ['🌸', '🌺', '🌷', '💐', '🌼', '✿'];
function spawnFloatingFlower() {
  const f = document.createElement('div');
  f.className = 'floating-flower';
  f.textContent = flowerEmojis[Math.floor(Math.random() * flowerEmojis.length)];
  const startX = Math.random() * 100;
  const delay = Math.random() * 3;
  f.style.cssText = `
    left: ${startX}%;
    top: ${Math.random() * 80 + 10}%;
    animation-duration: ${Math.random() * 6 + 10}s;
    animation-delay: ${delay}s;
  `;
  floatingFlowersEl.appendChild(f);
  setTimeout(() => f.remove(), 16000 + delay * 1000);
}
if (!motionLite) {
  setInterval(spawnFloatingFlower, 1200);
  for (let i = 0; i < 6; i++) spawnFloatingFlower();
}

// Bloom effects
const bloomsEl = document.getElementById('blooms');
const bloomEmojis = ['🌸', '🌺', '💐', '✿', '🌷'];
function spawnBloom() {
  const b = document.createElement('div');
  b.className = 'bloom';
  b.textContent = bloomEmojis[Math.floor(Math.random() * bloomEmojis.length)];
  const x = Math.random() * 100;
  const y = Math.random() * 100;
  const delay = Math.random() * 2;
  b.style.cssText = `
    left: ${x}%;
    top: ${y}%;
    animation-delay: ${delay}s;
  `;
  bloomsEl.appendChild(b);
  setTimeout(() => b.remove(), 4000 + delay * 1000);
}
if (!motionLite) {
  setInterval(spawnBloom, 800);
  for (let i = 0; i < 4; i++) spawnBloom();
}

// Living garden flowers
const liveGarden = document.getElementById('liveGarden');
const gardenPalettes = [
  ['#ff6f9f', '#ffd6e4', '#39c6d6'],
  ['#ffb3c6', '#fff1f6', '#5ee0c2'],
  ['#e85d9e', '#ffc2e2', '#2fc4a8'],
  ['#f6a6ff', '#ffe2fa', '#39c6d6'],
  ['#ff8fab', '#ffe4a6', '#7eeeb5']
];

function plantLiveFlower(index) {
  const flower = document.createElement('div');
  flower.className = 'css-flower';
  const [petalA, petalB, leaf] = gardenPalettes[index % gardenPalettes.length];
  const x = 5 + Math.random() * 90;
  const stem = 15 + Math.random() * 17;
  const size = 4.8 + Math.random() * 4.6;
  flower.style.cssText = `
    --x: ${x}%;
    --stem: ${stem}vmin;
    --size: ${size}vmin;
    --tilt: ${-18 + Math.random() * 36}deg;
    --delay: ${Math.random() * 3.8}s;
    --speed: ${3.8 + Math.random() * 2.8}s;
    --petal-a: ${petalA};
    --petal-b: ${petalB};
    --leaf: ${leaf};
  `;
  flower.innerHTML = `
    <div class="flower-stem"></div>
    <div class="stem-leaf left"></div>
    <div class="stem-leaf right"></div>
    <div class="stem-leaf left small"></div>
    <div class="flower-bloom">
      <span class="bloom-petal"></span>
      <span class="bloom-petal"></span>
      <span class="bloom-petal"></span>
      <span class="bloom-petal"></span>
      <span class="bloom-petal"></span>
      <span class="bloom-petal"></span>
      <div class="bloom-core"></div>
    </div>
  `;
  liveGarden.appendChild(flower);
}

function plantGrassBlade(index) {
  const grass = document.createElement('span');
  grass.className = 'grass-blade';
  grass.style.cssText = `
    --x: ${Math.random() * 100}%;
    --w: ${2.5 + Math.random() * 8}vmin;
    --h: ${10 + Math.random() * 18}vmin;
    --r: ${-38 + Math.random() * 76}deg;
    --speed: ${2.5 + Math.random() * 2.2}s;
    --delay: ${Math.random() * 2}s;
  `;
  return grass;
}

function releaseFirefly(index) {
  const firefly = document.createElement('span');
  firefly.className = 'firefly';
  firefly.style.cssText = `
    --x: ${6 + Math.random() * 88}%;
    --y: ${8 + Math.random() * 46}vmin;
    --drift: ${-18 + Math.random() * 36}vmin;
    --speed: ${4.5 + Math.random() * 4}s;
    --delay: ${Math.random() * 5}s;
  `;
  liveGarden.appendChild(firefly);
}

const grassPatch = document.createElement('div');
grassPatch.className = 'garden-grass';
for (let i = 0; i < (motionLite ? 14 : 34); i++) grassPatch.appendChild(plantGrassBlade(i));
liveGarden.appendChild(grassPatch);

for (let i = 0; i < (motionLite ? 7 : 16); i++) plantLiveFlower(i);
for (let i = 0; i < (motionLite ? 7 : 16); i++) releaseFirefly(i);

// Flower rings
function buildRing(id, emojis, count, radius) {
  const ring = document.getElementById(id);
  if (!ring) return;
  for (let i = 0; i < count; i++) {
    const span = document.createElement('span');
    span.textContent = emojis[i % emojis.length];
    const angle = (i / count) * 2 * Math.PI;
    const x = 50 + radius * Math.cos(angle);
    const y = 50 + radius * Math.sin(angle);
    span.style.cssText = `top: ${y}%; left: ${x}%; transform: translate(-50%, -50%); font-size: 18px;`;
    ring.appendChild(span);
  }
}

if (!motionLite) {
  buildRing('flowerRing', ['🌸','🌺','🌷','✿','💐','🌼'], 10, 48);
  buildRing('flowerRing2', ['🌸','🌺','🌷','✿','💐','🌼'], 8, 48);
}

// Song button
const songPlayer = document.getElementById('songPlayer');
const musicToggle = document.getElementById('musicToggle');
const musicLabel = musicToggle.querySelector('.music-label');

musicToggle.addEventListener('click', async () => {
  try {
    if (songPlayer.paused) {
      await songPlayer.play();
      musicToggle.classList.add('is-playing');
      musicLabel.textContent = 'Pause song';
      musicToggle.setAttribute('aria-label', 'Pause song');
    } else {
      songPlayer.pause();
      musicToggle.classList.remove('is-playing');
      musicLabel.textContent = 'Play song';
      musicToggle.setAttribute('aria-label', 'Play song');
    }
  } catch (error) {
    musicLabel.textContent = 'Tap again';
  }
});
</script>
</body>
</html>
